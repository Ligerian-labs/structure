name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck (tsc per package)
        run: bun run typecheck
      - name: Test (bun test per package)
        run: bun run test

  e2e:
    name: Browser E2E (playwright fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install chromium
        working-directory: packages/playwright
        run: bunx playwright install chromium --with-deps
      - name: Run browser E2E suite
        working-directory: packages/playwright
        run: bun run test:e2e

  test-postgres:
    name: Postgres adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run pg adapter tests against real Postgres
        working-directory: packages/eventsourcing-pg
        run: bun test
      - name: Run auth pg adapter tests against real Postgres
        working-directory: packages/auth-pg
        run: bun test
      - name: Run migrations tests against real Postgres
        working-directory: packages/migrations
        run: bun test

  test-nisshi:
    name: Nisshi adapter tests (SQLite + Postgres sidecars)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NISSHI_VERSION: v0.7.0-pre.2
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download pinned Nisshi broker
        run: |
          curl -sL --fail -o nisshi.tar.gz \
            "https://github.com/nisshi-io/nisshi/releases/download/${NISSHI_VERSION}/nisshi-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf nisshi.tar.gz
          chmod +x bin/nisshi
          ./bin/nisshi --version
      - name: Start broker (memory engine)
        run: |
          ./bin/nisshi \
            --storage-engine memory://ci/ \
            --kafka-listener-url tcp://127.0.0.1:19092 \
            --kafka-advertised-listener-url tcp://127.0.0.1:19092 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/19092) 2>/dev/null; then echo "broker up"; exit 0; fi
            sleep 0.5
          done
          echo "broker never came up"; exit 1
      - name: Run nisshi adapter tests against real broker and Postgres sidecar
        working-directory: packages/eventsourcing-nisshi
        env:
          NISSHI_URL: tcp://127.0.0.1:19092
        run: bun test

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 'Check title follows "type(scope): description"'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore)(\([a-z0-9,-]+\))?!?: .+'; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "Allowed types: feat fix docs style refactor test chore"
            exit 1
          fi
